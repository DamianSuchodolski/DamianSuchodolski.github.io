# CVTurbo — konfiguracja nginx (Hetzner VPS)
# Instalacja: patrz deploy/DEPLOY.md
# Podmień: TWOJA-DOMENA.pl (2 miejsca)

server {
    listen 80;
    listen [::]:80;
    server_name TWOJA-DOMENA.pl www.TWOJA-DOMENA.pl;

    root /var/www/cvturbo;
    index index.html;
    charset utf-8;

    # Serwer AI (import CV, tłumacz, listy, kody) — ta sama domena = zero CORS
    location /api/ {
        proxy_pass http://127.0.0.1:4141;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;      # import/tłumaczenie może potrwać
        client_max_body_size 8m;      # zdjęcia CV do importu
    }

    # Statyczne pliki z sensownym cache
    location ~* \.(css|js|svg|png|jpe?g|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # drobne bezpieczeństwo
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
# Po instalacji certbot sam dopisze sekcję SSL (listen 443) i przekierowanie.
